<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Dettagli Alloggio - Trento Easy Start</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
        <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <header class="cd-header">
            <div class="header-wrapper">
                <div class="left-side">
                    <div class="menu-icon hover-target">
                        <span class="menu-icon__line menu-icon__line-left"></span>
                        <span class="menu-icon__line"></span>
                        <span class="menu-icon__line menu-icon__line-right"></span>
                    </div>
                    <div class="logo-wrap">
                        <a href="main.html" class="hover-target"><span>Trento</span>Easy Start</a>
                    </div>
                </div>
                <div class="multilingua">
                    <a href="#" class="hover-target" title="Italiano">🇮🇹</a> |
                    <a href="#" class="hover-target" title="Inglese">🇬🇧</a> |
                    <a href="#" class="hover-target" title="Tedesco">🇩🇪</a>
                    <span id="auth-links"></span>
                </div>
            </div>
        </header>

        <div class="nav">
            <div class="nav__content">
                <ul class="nav__list">
                    <li class="nav__list-item"><a href="main.html" class="hover-target">Home</a></li>
                    <li class="nav__list-item">
                        <a href="cerca-alloggio.html" class="hover-target">Cerca Alloggio</a>
                    </li>
                    <li class="nav__list-item">
                        <a href="supporto.html" class="hover-target">Supporto</a>
                    </li>
                    <li class="nav__list-item"><a href="servizi.html" class="hover-target">Servizi</a></li>
                    <li class="nav__list-item"><a href="eventi.html" class="hover-target">Eventi</a></li>
                    <li class="nav__list-item"><a href="chi-siamo.html" class="hover-target">Chi Siamo</a></li>
                </ul>
            </div>
        </div>

        <div class="container">
            <section class="accommodation-details-section">
                <h1 id="accommodation-title">Caricamento...</h1>
                <div class="accommodation-details">
                    <img id="accommodation-image" src="images/default.jpg" alt="Immagine Alloggio" style="max-width: 100%; height: auto;">
                    <p><strong>Tipo:</strong> <span id="accommodation-type"></span></p>
                    <p><strong>Località:</strong> <span id="accommodation-location"></span></p>
                    <p><strong>Descrizione:</strong></p>
                    <p id="accommodation-description"></p>
                    <p><strong>Coordinate:</strong> <span id="accommodation-coordinates"></span></p>
                    <div id="map" style="width: 100%; height: 400px; margin-top: 20px;"></div>
                </div>
            </section>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="script.js"></script>
        <script>
            $(document).ready(function(){
                $('#logout').click(function(e){
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('Logout effettuato con successo!');
                    window.location.href = 'index.html';
                });

                if (window.location.pathname.endsWith('accommodation.html')) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const accommodationId = urlParams.get('id');
                    if (accommodationId) {
                        fetchAccommodationDetails(accommodationId);
                    } else {
                        alert('ID dell\'alloggio non fornito');
                        window.location.href = 'cerca-alloggio.html';
                    }
                }

                async function fetchAccommodationDetails(id) {
                    try {
                        const res = await fetch(`/api/accommodations/${id}`, { 
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        const accommodation = await res.json();

                        if (res.ok) {
                            $('#accommodation-title').text(accommodation.name || 'Titolo non disponibile');
                            $('#accommodation-type').text(accommodation.type || 'Tipo non disponibile');
                            $('#accommodation-location').text(accommodation.address || 'Località non disponibile');
                            $('#accommodation-description').text(accommodation.description || 'Descrizione non disponibile');
                            $('#accommodation-coordinates').text(`Latitudine: ${accommodation.latitude}, Longitudine: ${accommodation.longitude}`);

                            if (accommodation.image) {
                                $('#accommodation-image').attr('src', accommodation.image);
                            } else {
                                $('#accommodation-image').attr('src', 'images/default.jpg');
                            }

                            initMap(accommodation.latitude, accommodation.longitude);
                        } else {
                            alert('Errore nel recupero dei dettagli dell\'alloggio');
                            window.location.href = 'cerca-alloggio.html';
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Errore nel recupero dei dettagli dell\'alloggio');
                        window.location.href = 'cerca-alloggio.html';
                    }
                }

                function initMap(lat, lon) {
                    const map = L.map('map').setView([lat, lon], 15);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    L.marker([lat, lon]).addTo(map)
                        .bindPopup('Ubicazione dell\'alloggio')
                        .openPopup();
                }
            });
        </script>
    </body>
</html>
