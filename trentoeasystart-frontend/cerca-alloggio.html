<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Cerca Alloggio - Trento Easy Start</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>

    <body>
        <header class="cd-header">
            <div class="header-wrapper">
                <div class="left-side">
                    <div class="menu-icon hover-target">
                        <span class="menu-icon__line menu-icon__line-left"></span>
                        <span class="menu-icon__line"></span>
                        <span class="menu-icon__line menu-icon__line-right"></span>
                    </div>
                    <div class="logo-wrap">
                        <a href="main.html" class="hover-target"><span>Trento</span>Easy Start</a>
                    </div>
                </div>
                <div class="multilingua">
                    <a href="#" class="hover-target" title="Italiano">🇮🇹</a> |
                    <a href="#" class="hover-target" title="Inglese">🇬🇧</a> |
                    <a href="#" class="hover-target" title="Tedesco">🇩🇪</a>
                    <span id="auth-links"></span>
                </div>
            </div>
        </header>

        <div class="nav">
            <div class="nav__content">
                <ul class="nav__list">
                    <li class="nav__list-item"><a href="main.html" class="hover-target">Home</a></li>
                    <li class="nav__list-item"><a href="cerca-alloggio.html" class="hover-target">Cerca Alloggio</a></li>
                    <li class="nav__list-item"><a href="supporto.html" class="hover-target">Supporto</a></li>
                    <li class="nav__list-item"><a href="servizi.html" class="hover-target">Servizi</a></li>
                    <li class="nav__list-item"><a href="eventi.html" class="hover-target">Eventi</a></li>
                    <li class="nav__list-item"><a href="chi-siamo.html" class="hover-target">Chi Siamo</a></li>
                </ul>
            </div>
        </div>

        <div class="container">
            <section class="search-section">
                <h1 style="color: #5ea813;">Cerca Alloggio a Trento</h1>
                <form class="search-form" id="search-form">
                    <input type="text" id="search-location" placeholder="Inserisci una località o un indirizzo" required>
                    <input type="number" id="search-minPrice" placeholder="Prezzo Minimo" min="0">
                    <input type="number" id="search-maxPrice" placeholder="Prezzo Massimo" min="0">
                    <button type="submit">Cerca</button>
                </form>

                <div class="search-results">
                    <div id="loading-message" style="display: none;">Caricamento in corso...</div>
                    <div class="accommodation-list" id="accommodation-list">
                    </div>
                </div>

                <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
                <script src="script.js"></script>

                <script>
                    $(document).ready(function () {
                        let minPrice = 0;
                        let maxPrice;
                        $('#search-minPrice').on('change', () => { minPrice = $(this).val(); });
                        $('#search-maxPrice').on('change', () => {
                            maxPrice = $(this).val();
                            console.log('max modificato', maxPrice);
                        });

                        $('#search-form').submit(async function (e) {
                            e.preventDefault();
                            $('#loading-message').show();
                            $('#accommodation-list').empty();

                            const location = $('#search-location').val();
                            const type = $('#search-type').val();
                            const minPrice = $('#search-minPrice').val();
                            const maxPrice = $('#search-maxPrice').val();

                            try {
                                const baseUrl = window.location.origin;
                                const fetchUrl = baseUrl + `/api/external-accommodations/fetch`;
                                const url = new URL(fetchUrl);
                                url.searchParams.append('location', location);

                                if (minPrice > 0) {
                                    url.searchParams.append('minPrice', minPrice);
                                }
                                if (maxPrice && maxPrice > 0) {
                                    url.searchParams.append('maxPrice', maxPrice);

                                }
                                console.log(url.toString());
                                const response = await fetch(url.toString());
                                const accommodations = await response.json();

                                $('#loading-message').hide();

                                if (accommodations.length === 0) {
                                    $('#accommodation-list').append('<p>Nessun risultato trovato.</p>');
                                } else {
                                    accommodations.forEach((accommodation) => {
                                        console.log('accomodation = ', accommodation);
                                        const accommodationHtml = `
                                            <div class="accommodation-item">
                                                <h3>${accommodation.title || 'Titolo non disponibile'}</h3>
                                                <p><strong>Prezzo:</strong> ${accommodation.priceLabel || 'Non disponibile'}</p>
                                                <p><strong>Località:</strong> ${accommodation.location || 'Non disponibile'}</p>
                                                <p><strong>Descrizione:</strong> ${accommodation.description || 'Non disponibile'}</p>
                                                <img src="${accommodation.image}"/>
                                                <a href="${accommodation.url}" target="_blank" class="details">Vedi Dettagli</a>
                                            </div>
                                        `;
                                        $('#accommodation-list').append(accommodationHtml);
                                    });
                                }
                            } catch (error) {
                                console.error('Errore durante il recupero dei dati:', error);
                                $('#loading-message').hide();
                                $('#accommodation-list').append('<p>Errore nel caricamento dei dati. Riprova più tardi.</p>');
                            }
                        });
                    });
                </script>

            </section>
        </div>

        <footer>
            <p>&copy; <span id="current-year"></span> Trento Easy Start. Tutti i diritti riservati.</p>
        </footer>
    </body>
</html>
