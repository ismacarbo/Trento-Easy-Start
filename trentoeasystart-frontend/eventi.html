<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Eventi - Trento Easy Start</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <header class="cd-header">
            <div class="header-wrapper">
                <div class="left-side">
                    <div class="menu-icon hover-target">
                        <span class="menu-icon__line menu-icon__line-left"></span>
                        <span class="menu-icon__line"></span>
                        <span class="menu-icon__line menu-icon__line-right"></span>
                    </div>
                    <div class="logo-wrap">
                        <a href="main.html" class="hover-target"><span>Trento</span>Easy Start</a>
                    </div>
                </div>
                <div class="multilingua">
                    <a href="#" class="hover-target" title="Italiano">🇮🇹</a> |
                    <a href="#" class="hover-target" title="Inglese">🇬🇧</a> |
                    <a href="#" class="hover-target" title="Tedesco">🇩🇪</a>
                    <span id="auth-links"></span>
                </div>
            </div>
        </header>

        <div class="nav">
            <div class="nav__content">
                <ul class="nav__list">
                    <li class="nav__list-item"><a href="main.html" class="hover-target">Home</a></li>
                    <li class="nav__list-item">
                        <a href="cerca-alloggio.html" class="hover-target">Cerca Alloggio</a>
                    </li>
                    <li class="nav__list-item">
                        <a href="supporto.html" class="hover-target">Supporto</a>
                    </li>
                    <li class="nav__list-item"><a href="servizi.html" class="hover-target">Servizi</a></li>
                    <li class="nav__list-item"><a href="eventi.html" class="hover-target">Eventi</a></li>
                    <li class="nav__list-item"><a href="chi-siamo.html" class="hover-target">Chi Siamo</a></li>
                </ul>
            </div>
        </div>

        <div class="container">
            <section class="events-section">
                <div class="events-list" id="events-list">
                </div>
            </section>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="script.js"></script>
        <script>
            $(document).ready(function(){
                if (window.location.pathname.endsWith('main.html') || window.location.pathname.endsWith('cerca-alloggio.html') || window.location.pathname.endsWith('accommodation.html') || window.location.pathname.endsWith('eventi.html')) {
                    getUserData();
                }

                async function getUserData() {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        return;
                    }

                    try {
                        const res = await fetch('/api/auth', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-auth-token': token
                            }
                        });

                        const data = await res.json();

                        if (res.ok) {
                            if (window.location.pathname.endsWith('main.html')) {
                                $('#user-name').text(data.name);
                                $('#user-email').text(data.email);
                            }
                        } else {
                            alert(data.msg || 'Errore durante il recupero dei dati utente');
                            window.location.href = 'index.html';
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Errore durante il recupero dei dati utente');
                        window.location.href = 'index.html';
                    }
                }

                if (window.location.pathname.endsWith('eventi.html')) {
                    fetchEvents();
                }

                async function fetchEvents() {
                    try {
                        const res = await fetch('/api/events', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (res.status === 404) {
                            $('#events-list').append('<p>Nessun evento trovato.</p>');
                            return;
                        }

                        if (res.status === 401) {
                            alert('Non sei autorizzato. Effettua il login.');
                            window.location.href = 'index.html';
                            return;
                        }

                        if (!res.ok) {
                            alert('Errore durante il recupero degli eventi.');
                            return;
                        }

                        const events = await res.json();
                        console.log('Eventi ricevuti:', events); 
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);

                        const filteredEvents = events.filter(event => {
                            if (!event.date) return false; 
                            const eventDate = new Date(event.date);
                            eventDate.setHours(0, 0, 0, 0);
                            return eventDate >= today;
                        });

                        displayEvents(filteredEvents);
                    } catch (err) {
                        console.error(err);
                        alert('Errore durante il recupero degli eventi.');
                    }
                }

                function displayEvents(events) {
                    const eventsList = $('#events-list');
                    eventsList.empty();

                    if (events.length === 0) {
                        eventsList.append('<p>Nessun evento futuro trovato.</p>');
                        return;
                    }

                    events.forEach(event => {
                        const eventItem = `
                            <div class="event-item">
                                <h2>${event.title}</h2>
                                <p><i class="fas fa-calendar-alt"></i> ${new Date(event.date).toLocaleDateString('it-IT', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                <p><i class="fas fa-map-marker-alt"></i> ${event.link ? `<a href="${event.link}" target="_blank">Località</a>` : 'Località non disponibile'}</p>
                                <p>${event.description}</p>
                            </div>`;
                        eventsList.append(eventItem);
                    });
                }
            });
        </script>

    <footer>
        <p>&copy; <span id="current-year"></span>Trento Easy Start. Tutti i diritti riservati.</p>
    </footer>
    </body>
</html>
